<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15002e">
  <title>Premier League Live</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#08050f;--panel:#13101b;--panel2:#1c1728;--line:#30283e;--text:#f8f6fb;--muted:#aaa1ba;--pl:#6f20d8;--live:#35e680;--goal:#ffd35a;--red:#ff5b67}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#1b0a36 0,#08050f 36%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
    .app{max-width:760px;margin:0 auto;padding:18px 14px 34px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand img{width:44px;height:44px}
    h1{font-size:1.25rem;margin:0;line-height:1.1}
    .sub{color:var(--muted);font-size:.82rem;margin-top:3px}
    .live{display:flex;align-items:center;gap:7px;background:#0e2a1a;border:1px solid #236a41;border-radius:999px;padding:8px 10px;font-weight:800;font-size:.78rem;white-space:nowrap}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(53,230,128,.55);animation:pulse 1.8s infinite}
    @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(53,230,128,0)}100%{box-shadow:0 0 0 0 rgba(53,230,128,0)}}
    @media (prefers-reduced-motion:reduce){.dot{animation:none}}
    .statusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:.8rem;margin:8px 2px 16px;flex-wrap:wrap}
    button{border:0;background:var(--pl);color:white;font-weight:800;border-radius:12px;padding:10px 13px;min-height:44px;cursor:pointer}
    button:disabled{opacity:.6;cursor:default}
    section{margin-top:18px}
    .sectionTitle{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 2px 10px}
    .sectionTitle h2{font-size:1rem;margin:0}
    .sectionTitle span{color:var(--muted);font-size:.78rem}
    .stack{display:grid;gap:10px}
    .match{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:17px;padding:14px}
    .matchTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
    .matchStatus{font-size:.8rem;font-weight:900;color:var(--muted)}
    .matchStatus.in{color:var(--live)}
    .teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
    .team{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800}
    .team.away{justify-content:flex-end;text-align:right;flex-direction:row-reverse}
    .team img{width:34px;height:34px;object-fit:contain;flex:0 0 auto}
    .teamName{overflow:hidden;text-overflow:ellipsis}
    .score{font-size:1.55rem;font-weight:950;letter-spacing:.02em;min-width:68px;text-align:center}
    .events{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:7px}
    .event{font-size:.84rem;display:flex;align-items:flex-start;gap:8px;color:#ddd7e8}
    .tag{font-size:.68rem;border-radius:999px;padding:3px 6px;font-weight:900;line-height:1.2;flex:0 0 auto}
    .tag.goal{background:#3b3211;color:var(--goal)}
    .tag.red{background:#3a1015;color:#ff9ca4}
    .tag.yellow{background:#3b3511;color:#ffe88a}
    .empty,.error{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;color:var(--muted);text-align:center}
    .error{border-color:#6c3137;color:#ffbec3}
    .latest{background:#1a1325;border:1px solid #3b2b52;border-radius:15px;padding:11px 12px;display:flex;gap:9px;align-items:flex-start}
    .latest strong{display:block;font-size:.86rem}
    .latest span{color:var(--muted);font-size:.78rem}
    .footer{margin-top:22px;color:#7e748e;font-size:.72rem;text-align:center;line-height:1.45}
    @media(max-width:430px){.app{padding-left:11px;padding-right:11px}.brand img{width:38px;height:38px}h1{font-size:1.08rem}.team img{width:30px;height:30px}.teamName{font-size:.9rem}.score{font-size:1.35rem;min-width:58px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><img src="icon.svg" alt="Premier League Live icon"><div><h1>Premier League Live</h1><div class="sub">Scores & match updates</div></div></div>
      <div class="live"><span class="dot"></span>LIVE</div>
    </header>

    <div class="statusbar">
      <span id="updated" aria-live="polite">Connecting…</span>
      <button id="refresh" type="button">Refresh now</button>
    </div>

    <section>
      <div class="sectionTitle"><h2>Today</h2><span id="dateLabel"></span></div>
      <div id="matches" class="stack"><div class="empty">Loading Premier League matches…</div></div>
    </section>

    <section>
      <div class="sectionTitle"><h2>Latest significant updates</h2><span>Goals & cards</span></div>
      <div id="updates" class="stack"><div class="empty">Waiting for match events…</div></div>
    </section>

    <div class="footer">Automatically checks for fresh Premier League data every 15 seconds while this app is open. Data source: ESPN public match feed.</div>
  </main>

  <script>
  (()=>{
    const API='https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard';
    const REFRESH_MS=15000;
    const matchesEl=document.getElementById('matches');
    const updatesEl=document.getElementById('updates');
    const updatedEl=document.getElementById('updated');
    const refreshBtn=document.getElementById('refresh');
    const dateLabel=document.getElementById('dateLabel');
    let busy=false;

    const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const localDateKey=()=>{const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`};
    const statusClass=s=>s?.type?.state==='in'?'in':'';
    const formatKickoff=iso=>new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(iso));
    const teamOf=(comp,side)=>comp.competitors.find(t=>t.homeAway===side)||{};
    const teamName=t=>t.team?.shortDisplayName||t.team?.displayName||'Team';
    const statusText=(comp,event)=>{
      const st=comp.status||{};
      if(st.type?.state==='pre') return formatKickoff(event.date);
      if(st.type?.state==='post') return st.type?.shortDetail||'Final';
      return st.displayClock||st.type?.shortDetail||'Live';
    };
    const eventKind=d=>{
      if(d.scoringPlay) return 'goal';
      if(d.redCard || /red card/i.test(d.type?.text||'')) return 'red';
      if(d.yellowCard || /yellow card/i.test(d.type?.text||'')) return 'yellow';
      return null;
    };
    const eventLabel=d=>d.scoringPlay?(d.ownGoal?'OWN GOAL':'GOAL'):d.redCard?'RED':'CARD';
    const eventText=(d,comp)=>{
      const player=d.athletesInvolved?.[0]?.displayName||'Player';
      const tid=String(d.team?.id||'');
      const t=comp.competitors.find(x=>String(x.id)===tid);
      const tn=t?teamName(t):'';
      const detail=d.penaltyKick?' (penalty)':d.ownGoal?' (own goal)':'';
      return `${d.clock?.displayValue||''} ${player}${detail}${tn?` — ${tn}`:''}`.trim();
    };

    function renderMatch(event){
      const comp=event.competitions?.[0]||{};
      const home=teamOf(comp,'home'), away=teamOf(comp,'away');
      const important=(comp.details||[]).filter(d=>eventKind(d)).slice().sort((a,b)=>(a.clock?.value||0)-(b.clock?.value||0));
      const eventsHtml=important.length?`<div class="events">${important.map(d=>`<div class="event"><span class="tag ${eventKind(d)}">${esc(eventLabel(d))}</span><span>${esc(eventText(d,comp))}</span></div>`).join('')}</div>`:'';
      return `<article class="match">
        <div class="matchTop"><span class="matchStatus ${statusClass(comp.status)}">${esc(statusText(comp,event))}</span><span class="matchStatus">${esc(comp.broadcasts?.[0]?.names?.[0]||comp.geoBroadcasts?.[0]?.media?.shortName||'')}</span></div>
        <div class="teams">
          <div class="team"><img src="${esc(home.team?.logo||'')}" alt=""><span class="teamName">${esc(teamName(home))}</span></div>
          <div class="score">${esc(home.score??'-')} – ${esc(away.score??'-')}</div>
          <div class="team away"><img src="${esc(away.team?.logo||'')}" alt=""><span class="teamName">${esc(teamName(away))}</span></div>
        </div>${eventsHtml}
      </article>`;
    }

    function renderUpdates(events){
      const rows=[];
      for(const event of events){
        const comp=event.competitions?.[0]||{};
        for(const d of comp.details||[]){
          const kind=eventKind(d);
          if(!kind) continue;
          rows.push({kind,clock:d.clock?.value||0,text:eventText(d,comp),match:event.shortName||event.name||'',label:eventLabel(d)});
        }
      }
      rows.sort((a,b)=>b.clock-a.clock);
      const sig=rows.slice(0,12);
      if(!sig.length){updatesEl.innerHTML='<div class="empty">No goals or cards reported yet.</div>';return;}
      updatesEl.innerHTML=sig.map(r=>`<div class="latest"><span class="tag ${r.kind}">${esc(r.label)}</span><div><strong>${esc(r.text)}</strong><span>${esc(r.match)}</span></div></div>`).join('');
    }

    async function load(){
      if(busy) return;
      busy=true;refreshBtn.disabled=true;
      try{
        const url=`${API}?dates=${localDateKey()}&_=${Date.now()}`;
        const res=await fetch(url,{cache:'no-store',credentials:'omit'});
        if(!res.ok) throw new Error(`Score feed returned ${res.status}`);
        const data=await res.json();
        const events=Array.isArray(data.events)?data.events:[];
        matchesEl.innerHTML=events.length?events.map(renderMatch).join(''):'<div class="empty">No Premier League matches today.</div>';
        renderUpdates(events);
        updatedEl.textContent=`Updated ${new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date())}`;
      }catch(err){
        matchesEl.innerHTML=`<div class="error">Could not reach the live score feed. ${esc(err.message||'Please try again.')}</div>`;
        updatedEl.textContent='Live connection unavailable';
      }finally{busy=false;refreshBtn.disabled=false}
    }

    dateLabel.textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date());
    refreshBtn.addEventListener('click',load);
    load();
    const timer=setInterval(load,REFRESH_MS);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden) load()});
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
    window.addEventListener('pagehide',()=>clearInterval(timer),{once:true});
  })();
  </script>
</body>
</html>
