<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b6ff00"><meta name="description" content="Daily Lift — a private, adaptive positive boost for tough days."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Daily Lift</title>
<style>
:root{--bg:#050505;--card:#101010;--lime:#b6ff00;--text:#f7f7f7;--muted:#bcbcbc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100vh;min-height:100dvh;padding:22px;background:radial-gradient(circle at 50% 8%,#1d2a00 0,#090d00 28%,#050505 58%)}main{width:min(720px,100%);margin:auto;text-align:center}.logo{width:76px;height:76px;margin:4px auto 8px;display:grid;place-items:center;border:3px solid var(--lime);border-radius:24px;box-shadow:0 0 28px #b6ff0060;font-size:38px;font-weight:900;color:var(--lime)}h1{margin:3px 0 0;font-size:clamp(34px,8vw,52px);letter-spacing:-2px;color:var(--lime)}.date{margin:7px 0 18px;color:var(--muted);font-weight:650}.card{background:linear-gradient(180deg,#121212,#0c0c0c);border:1px solid #303030;border-radius:25px;padding:24px 20px;box-shadow:0 18px 55px #0008;margin-bottom:14px}.eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:1.7px;font-size:12px;font-weight:900}.question{font-size:21px;font-weight:850;margin:10px 0 14px}.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.chip{border:1px solid #444;background:#171717;color:#eee;border-radius:14px;padding:12px 8px;font-weight:750;font-size:14px;box-shadow:none}.chip.selected{background:var(--lime);color:#050505;border-color:var(--lime)}textarea{width:100%;min-height:70px;margin-top:12px;padding:13px;border-radius:14px;border:1px solid #444;background:#090909;color:#fff;font:inherit;resize:vertical}.privacy{font-size:11px;color:#777;margin:6px 0 0}.primary{width:100%;border:0;border-radius:17px;padding:16px 18px;background:var(--lime);color:#050505;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 0 24px #b6ff0038;margin-top:14px}.primary:active,.chip:active{transform:scale(.985)}.result{display:none}.result.show{display:block}.message{font-size:clamp(24px,6vw,34px);line-height:1.2;font-weight:850;margin:13px auto 14px;max-width:590px}.small{color:var(--muted);line-height:1.55;margin:0 auto 14px;max-width:560px}.action{border-left:3px solid var(--lime);background:#151515;border-radius:10px;padding:13px 14px;text-align:left;margin:14px 0;color:#eee}.secondary{background:#1b1b1b;color:var(--lime);border:1px solid #3b3b3b;box-shadow:none;margin-top:8px}.footer{font-size:13px;color:#888;margin:17px 0}.spark{color:var(--lime)}@media(min-width:600px){.chips{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><main><div class="logo">↑</div><h1>Daily Lift</h1><div class="date" id="date"></div>
<section class="card" id="checkin"><div class="eyebrow">Make this one fit today</div><div class="question">What's making today tough?</div><div class="chips" id="causes"></div><div class="question" style="margin-top:18px">What are you feeling most?</div><div class="chips" id="feelings"></div><textarea id="detail" maxlength="240" placeholder="Optional: what's going on? (stays on this device)"></textarea><div class="privacy">Daily Lift does not send or save what you type.</div><button class="primary" id="lift">Give me a lift for this</button></section>
<section class="card result" id="result" aria-live="polite"><div class="eyebrow" id="label">Your lift right now</div><div class="message" id="message"></div><p class="small" id="perspective"></p><div class="action"><b>One useful move:</b> <span id="action"></span></div><button class="primary" id="another">Give me another one for this</button><button class="primary secondary" id="change">Something else is bothering me</button></section>
<div class="footer"><span class="spark">✦</span> One good thought. One good move. Keep going.</div></main>
<script>
const causes={
 work:{name:'Work',open:['A hard workday is not a verdict on your ability.','You can care about doing well without carrying the entire day at once.','Pressure at work can be real without getting to define you.'],moves:['Choose the single next task that matters most and give it ten focused minutes.','Separate what you control from what belongs to somebody else. Handle only your side first.','Write down the next three work steps, then ignore everything below number one for now.']},
 money:{name:'Money',open:['Money pressure can make every problem feel urgent at the same time. It is still a problem you can break into pieces.','A difficult financial moment says nothing about your worth.','You do not have to solve your whole financial future tonight.'],moves:['Name the one money decision that actually needs attention today; let the rest wait.','Before making a stress-driven purchase or decision, give yourself ten minutes and look at the numbers once.','Choose one controllable action: check a balance, postpone a nonessential expense, or write down the next bill.']},
 family:{name:'Family / relationship',open:['You can love someone and still be frustrated, hurt, or tired.','A difficult interaction does not require an immediate perfect response.','You are allowed to protect some calm before deciding what to say next.'],moves:['Give the situation a little space, then decide what you actually want the other person to understand.','If a conversation is heated, wait until you can say the important part without trying to win the whole argument.','Reach out to one person who tends to leave you steadier, not more stirred up.']},
 lonely:{name:'Lonely',open:['Feeling disconnected can make a day feel much heavier than it looks from the outside.','Loneliness is a signal for connection, not proof that you do not matter.','You do not need a crowd. One genuine connection can change the shape of a day.'],moves:['Send one low-pressure message: “Hey, just checking in. How are you?”','Put yourself around people for a little while, even if it is only a familiar public place.','Think of the safest person in your circle and make one small bid for connection.']},
 overwhelmed:{name:'Too much at once',open:['When everything feels important, the brain treats everything like an emergency. It is not all due this minute.','Overwhelmed often means the load needs sorting, not that you are incapable.','You do not need more pressure right now. You need a smaller target.'],moves:['Pick one task that takes under ten minutes and finish only that.','Make three buckets: now, later, and not mine. Put each problem into one bucket.','Stop adding tasks for ten minutes. Finish or deliberately postpone one thing already on your list.']},
 health:{name:'Health / energy',open:['A low-energy day still counts. Your pace can change without your direction changing.','Taking care of yourself is productive when your body or mind is running low.','You do not have to earn basic care by having a productive day first.'],moves:['Do a basic reset: water, a regular meal if due, a few minutes of movement if comfortable, and a quieter next step.','Lower the size of the next task rather than abandoning the whole day.','Choose one restorative thing you can realistically do in the next 20 minutes.']},
 mistake:{name:'I messed something up',open:['One mistake is information, not an identity.','You can regret a choice without turning it into a judgment about your whole character.','The useful question is not “How could I do that?” It is “What is my best next move?”'],moves:['Write down what happened, what you can repair, and one thing you will do differently next time.','If an apology or correction is needed, make it simple and specific instead of rehearsing the mistake all day.','Do the smallest repair that is actually available now; then stop retrying the past in your head.']},
 future:{name:'Worried about the future',open:['Uncertainty makes the mind write stories before the facts arrive.','You can prepare for tomorrow without living there all day.','Not knowing what happens next is uncomfortable, but it is not the same as knowing something bad will happen.'],moves:['Write down the worry, then beside it write one fact you know and one action you control.','Give the future ten minutes of planning, then return to one thing happening today.','Ask: “Is there an action here, or only a prediction?” If there is an action, make it small and concrete.']},
 badDay:{name:'Just a bad day',open:['A bad stretch of hours does not get to name the whole day.','You do not need a reason impressive enough to justify feeling off.','Some days need recovery more than analysis.'],moves:['Change one physical thing: location, posture, light, water, or a short walk if comfortable.','Choose an easy win that can be completed in ten minutes.','Do one thing you normally enjoy without requiring yourself to feel better first.']}
};
const feelings={stressed:{name:'Stressed',pers:['Stress narrows attention. Shrinking the next step can make the situation feel more workable.','You do not need to feel completely calm before doing one useful thing.']},sad:{name:'Down / sad',pers:['You do not have to argue yourself out of feeling down. Give the feeling room without giving it control of every next choice.','A low mood can make progress harder to notice. Small actions still count.']},angry:{name:'Angry',pers:['Anger can carry useful information, but it does not have to choose your next move.','The first goal is not to prove a point. It is to get enough space to choose your response.']},anxious:{name:'Anxious / worried',pers:['Anxiety is good at presenting possibilities as if they are facts. Bring your attention back to what is known and controllable.','You can feel uncertain and still make a grounded next decision.']},tired:{name:'Drained',pers:['Being drained changes what a reasonable goal looks like. Smaller is not the same as giving up.','Low energy is a reason to prioritize, not a reason to attack yourself.']},frustrated:{name:'Frustrated',pers:['Frustration often means something is blocked. Look for a different route instead of pushing harder at the same wall.','You can dislike how this is going and still choose the next useful move.']},unmotivated:{name:'No motivation',pers:['Motivation often shows up after movement begins, not before.','Do not wait for a big burst of motivation. Make the starting line easier to cross.']},mixed:{name:'A mix of everything',pers:['You do not have to untangle every feeling before taking care of yourself.','When feelings are mixed, simplify the decision: what would make the next hour 5% easier?']}};
const bridges=['This moment is asking for a next step, not a complete life solution.','You can be having a hard time and still be moving forward.','Give yourself credit for staying engaged with the day instead of demanding perfection.','The goal is not to force a positive feeling. It is to make the next few minutes a little more manageable.','You have permission to solve only the part that is actually in front of you.','A reset can begin in the middle of an ordinary day.'];
let cause='badDay',feeling='mixed',last='';
function buildChips(obj,id,setter){const box=document.getElementById(id);Object.entries(obj).forEach(([k,v])=>{const b=document.createElement('button');b.className='chip';b.textContent=v.name;b.onclick=()=>{setter(k);[...box.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};box.appendChild(b)})}
buildChips(causes,'causes',v=>cause=v);buildChips(feelings,'feelings',v=>feeling=v);
function pick(a){return a[Math.floor(Math.random()*a.length)]}function generate(){let signature,tries=0;do{signature=[pick(causes[cause].open),pick(feelings[feeling].pers),pick(bridges),pick(causes[cause].moves)];tries++}while(signature.join('|')===last&&tries<12);last=signature.join('|');document.getElementById('label').textContent=causes[cause].name+' • '+feelings[feeling].name;document.getElementById('message').textContent=signature[0];document.getElementById('perspective').textContent=signature[1]+' '+signature[2];document.getElementById('action').textContent=signature[3];document.getElementById('result').classList.add('show');document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('lift').onclick=generate;document.getElementById('another').onclick=generate;document.getElementById('change').onclick=()=>{document.getElementById('result').classList.remove('show');document.getElementById('checkin').scrollIntoView({behavior:'smooth'})};
const now=new Date();document.getElementById('date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
