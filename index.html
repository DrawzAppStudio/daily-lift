<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b6ff00"><meta name="description" content="Daily Lift — adaptive encouragement for tough days."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Daily Lift</title><style>:root{--bg:#050505;--card:#101010;--lime:#b6ff00;--text:#f7f7f7;--muted:#bcbcbc}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:22px;background:radial-gradient(circle at 50% 8%,#1d2a00,#090d00 28%,#050505 58%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{width:min(720px,100%);margin:auto;text-align:center}.logo{width:76px;height:76px;margin:4px auto 8px;display:grid;place-items:center;border:3px solid var(--lime);border-radius:24px;box-shadow:0 0 28px #b6ff0060;font-size:38px;font-weight:900;color:var(--lime)}h1{margin:3px 0;font-size:clamp(34px,8vw,52px);color:var(--lime)}.date{margin:7px 0 18px;color:var(--muted);font-weight:650}.card{background:linear-gradient(#121212,#0c0c0c);border:1px solid #303030;border-radius:25px;padding:24px 20px;margin-bottom:14px}.eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:1.7px;font-size:12px;font-weight:900}.question{font-size:21px;font-weight:850;margin:10px 0 14px}.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.chip{border:1px solid #444;background:#171717;color:#eee;border-radius:14px;padding:12px 8px;font-weight:750}.chip.selected{background:var(--lime);color:#050505;border-color:var(--lime)}textarea{width:100%;min-height:70px;margin-top:12px;padding:13px;border-radius:14px;border:1px solid #444;background:#090909;color:#fff;font:inherit}.privacy{font-size:11px;color:#777;margin:6px}.primary{width:100%;border:0;border-radius:17px;padding:16px;background:var(--lime);color:#050505;font-size:17px;font-weight:900;margin-top:14px}.result{display:none}.result.show{display:block}.message{font-size:clamp(24px,6vw,34px);line-height:1.2;font-weight:850;margin:13px auto}.small{color:var(--muted);line-height:1.55}.action{border-left:3px solid var(--lime);background:#151515;border-radius:10px;padding:13px;text-align:left;margin:14px 0}.secondary{background:#1b1b1b;color:var(--lime);border:1px solid #3b3b3b;margin-top:8px}.footer{font-size:13px;color:#888;margin:17px}.spark{color:var(--lime)}@media(min-width:600px){.chips{grid-template-columns:repeat(3,1fr)}}</style></head><body><main><div class="logo">↑</div><h1>Daily Lift</h1><div class="date" id="date"></div><section class="card" id="checkin"><div class="eyebrow">Make this one fit today</div><div class="question">What's making today tough?</div><div class="chips" id="causes"></div><div class="question" style="margin-top:18px">What are you feeling most?</div><div class="chips" id="feelings"></div><textarea id="detail" maxlength="240" placeholder="Optional: what's going on? (stays on this device)"></textarea><div class="privacy">Daily Lift does not send or save what you type.</div><button class="primary" id="lift">Give me a lift for this</button></section><section class="card result" id="result" aria-live="polite"><div class="eyebrow" id="label"></div><div class="message" id="message"></div><p class="small" id="perspective"></p><div class="action"><b>One useful move:</b> <span id="action"></span></div><button class="primary" id="another">Give me another one for this</button><button class="primary secondary" id="change">Something else is bothering me</button></section><div class="footer"><span class="spark">✦</span> One good thought. One good move. Keep going.</div></main><script>
const C={work:['A rough day at work cannot erase the things you know how to do.','One difficult task does not get to grade your whole career.','You are more capable than this frustrating hour makes you feel.','Pressure is evidence that something matters to you, not evidence that you are failing.','You have solved hard work problems before. You do not need to solve every one at once.','Your value is bigger than today’s productivity.','Being behind is a situation, not a character flaw.','You can have a demanding job and still protect a little peace inside the day.','One person’s criticism does not become your identity just because it was loud.','You are allowed to learn while doing the job. Nobody begins every challenge already knowing the answer.'],money:['Money can be tight without hope being gone.','Your bank balance measures money, not your worth.','Financial pressure is a problem to work through, not a definition of who you are.','You do not need to fix the next five years today.','A difficult money season can change. It is not a permanent identity.','Every sensible choice counts even when the numbers are not where you want them yet.','You are allowed to feel worried without assuming the worst outcome is guaranteed.','One bill, one balance, one decision at a time is enough for today.','Having less money than you want does not mean you have less value.','Progress with money is often boring and gradual. It still counts.'],family:['You can care deeply about someone and still need a little space.','One difficult conversation does not erase an entire relationship.','You do not have to answer hurt with more hurt.','Your feelings can be valid even when another person sees things differently.','You can choose peace without pretending nothing happened.','Love does not require winning every disagreement.','A relationship problem deserves thought, not an instant verdict on the whole relationship.','You can be kind and still have boundaries.','Someone else’s bad mood does not have to become yours.','You are allowed to wait until your words match what you really mean.'],lonely:['Being alone right now is not the same as being unwanted.','There are people you have not met yet who will be glad they met you.','A quiet phone does not measure how much you matter.','Loneliness can make the world look emptier than it really is.','You deserve connection that feels genuine, not connection you have to beg for.','One sincere conversation can matter more than a room full of people.','Your presence has mattered in moments you probably never got to see.','You are still part of the world on the days you feel disconnected from it.','You do not need everyone to understand you. Finding one person who does can be enough for this moment.','There is nothing weak about wanting company, affection, or someone to listen.'],overwhelmed:['You do not have to carry tomorrow while you are still handling today.','Everything being important does not mean everything must happen now.','You are not failing; your brain may simply have too many tabs open.','The whole mountain is not your assignment. The next foothold is.','You can put something down without abandoning it forever.','A smaller plan can be a smarter plan.','You are allowed to make today simpler.','Doing one thing deliberately is better than panicking about twenty things at once.','There is no prize for making an already hard day harder on yourself.','You can pause long enough to decide what actually deserves your energy.'],health:['Your body deserves care, especially on a day when it is making things harder.','A low-energy day is still part of your progress.','Rest and recovery are not wasted time.','You are allowed to adjust the pace without abandoning the direction.','Your best today does not have to look like your best on an easier day.','Taking care of yourself is something worth accomplishing.','Your body is not your enemy because it needs attention.','You can respect your limits without letting them define every possibility ahead.','Small healthy choices count long before they become dramatic results.','You deserve patience while your body and mind do difficult work.'],mistake:['A mistake can become a lesson without becoming a life sentence.','You are allowed to know better now than you did five minutes ago.','One wrong choice does not cancel all the good choices you have made.','The fact that you care about the mistake says something good about you.','You cannot edit the last moment, but you still own the next one.','You are a person who made a mistake, not a mistake pretending to be a person.','Growth often looks like noticing what you wish you had done differently.','You do not have to punish yourself to prove you learned something.','Repair what you can, learn what you can, and let yourself move forward.','Perfection would teach you very little. Recovery teaches you plenty.'],future:['The future has not happened yet. Worry is not a preview.','Not knowing what comes next also means the worst outcome is not known.','You can prepare without predicting disaster.','Tomorrow does not need you to suffer through it in advance.','Uncertainty leaves room for good outcomes too.','Your mind can imagine a problem faster than life can confirm one.','You have handled things you once worried you would never handle.','You only need enough courage for the next real step, not every imaginary one.','Plans can change. So can circumstances. So can you.','There are possibilities ahead that anxiety is not showing you.'],badDay:['This day is allowed to be imperfect and still contain something good.','A bad hour is not automatically a bad day.','You do not need to turn today around all at once.','Sometimes making it through with your sense of humor intact is enough.','You are allowed to start the day over at 2:17 in the afternoon.','Nothing says the next hour has to feel like the last one.','Some days are for thriving. Some are for regrouping. Both belong in a real life.','You can stop grading today and simply live the next few minutes.','There may still be a good moment hiding later in this day.','You woke up with no obligation to be perfect today. That rule still stands.']};
const F={stressed:['Your nervous system may be sounding an alarm. You can listen without handing it the steering wheel.','Stress can make a manageable problem look enormous. Shrink the view to the next step.','You do not need complete calm before you can regain a little control.','Take some pressure off the pressure: you are allowed to be stressed.','The feeling is real, but it does not automatically mean the situation is dangerous.'],sad:['You do not need to manufacture happiness to deserve a gentler moment.','Feeling down does not erase the parts of you that are still strong.','You can let sadness sit beside you without letting it make every decision.','Today may need kindness more than motivation.','A heavy feeling can move slowly and still move.'],angry:['Anger can tell you something matters. You still get to choose what happens next.','You do not have to make a permanent decision from a temporary surge of anger.','Creating space is not losing the argument. It is keeping control of yourself.','You can be angry and thoughtful at the same time.','The strongest response may be the one you choose after the heat drops.'],anxious:['Anxiety speaks confidently about things it cannot actually know.','A possibility is not a prediction and a prediction is not a fact.','You can be uncertain without being unsafe.','Bring your attention back from every possible tomorrow to the one moment actually happening.','You have permission to stop solving problems that have not occurred.'],tired:['Tired brains tell harsh stories. Do not make them your final judgment.','You may need less pressure, not more motivation.','A reduced pace can still move you forward.','Being exhausted is not the same thing as being lazy.','You can make the next goal small enough to match the energy you actually have.'],frustrated:['A blocked path does not mean there is no path.','You can stop pushing the same door and look for another one.','Frustration is uncomfortable, but it often appears right beside persistence.','You do not have to like the situation to handle it well.','Give yourself a moment before deciding that difficult means impossible.'],unmotivated:['You do not need to feel inspired to begin something tiny.','Momentum can arrive after the first move.','Lower the starting line until stepping over it feels almost too easy.','Motivation is welcome, but it is not required for one small action.','Five useful minutes still belong on the scoreboard.'],mixed:['You do not need the perfect name for the feeling before you can care for yourself.','When everything is tangled, aim for five percent better rather than completely fixed.','Mixed feelings are still real feelings. You can handle them one moment at a time.','You can be grateful and upset, hopeful and scared, tired and determined at the same time.','You are allowed to be complicated today.']};
const B=['This moment does not get the final word.','You are still allowed to expect good things from your life.','You have already survived days you once wished would hurry up and end.','There is more to your story than what is bothering you right now.','You do not need perfection to make progress.','Be on your own side for the next few minutes.','You deserve the same patience you would give somebody you care about.','Small wins are not fake wins. They are how momentum begins.','You can acknowledge what hurts without forgetting what is still possible.','The goal is not fake positivity. The goal is remembering that difficulty is not the whole picture.','Your next choice has not been made yet. That is a form of freedom.','There is strength in continuing without pretending everything is easy.','You can give yourself credit for effort before the outcome arrives.','A reset is available in the middle of the day, not just tomorrow morning.','You are worth encouraging even before you accomplish another thing.','One good moment can coexist with a difficult day.','You have permission to notice what is going right too.','You can take yourself seriously without taking every worried thought literally.','Nothing about being human requires you to handle every day beautifully.','Keep a little room open for the possibility that things go better than you expect.'];
const A={work:['Pick one task and give it ten uninterrupted minutes.','Write the next three steps and work only on number one.','Take a two-minute reset away from the screen, then return to the smallest clear task.','Identify what is actually yours to solve and release the rest for now.','Finish one easy item to create momentum.'],money:['Look at one real number instead of ten imagined outcomes.','Choose one expense or bill that actually needs attention today.','Delay a stress-driven purchase or financial decision for ten minutes.','Write one small money action you can complete this week.','Separate what must be paid now from what can legitimately wait.'],family:['Give yourself enough time to respond instead of react.','Decide what you want the other person to understand before speaking.','Send a calm message only if it improves the situation; silence is allowed for now.','Reach out to someone who tends to steady you.','Ask whether the next conversation needs a solution or simply honest listening.'],lonely:['Send one simple message to someone safe. No perfect opening required.','Spend a little time somewhere other people are present.','Call or message the person most likely to be glad to hear from you.','Do one activity that makes you feel connected to the wider world.','Offer a small kindness to someone; connection can start from either direction.'],overwhelmed:['Make three columns: now, later, not mine. Sort the problems.','Complete one task that takes under ten minutes.','Remove one nonessential thing from today’s list.','Set a ten-minute timer and focus on only one target.','Stop adding tasks and deliberately finish or postpone one existing item.'],health:['Have some water and check whether you are due for a regular meal.','Choose a few minutes of comfortable movement or rest, whichever your body needs.','Reduce the next task to a size that matches today’s energy.','Do one basic act of care before demanding more productivity from yourself.','Give yourself a short low-stimulation break and reassess afterward.'],mistake:['Name one repair you can make and do only that first.','Write what happened, what you learned, and what changes next time.','If an apology is needed, make it simple, sincere, and specific.','Stop replaying the entire event and identify the next controllable action.','Give yourself the advice you would give a friend who made the same mistake.'],future:['Write one fact you know and one action you control.','Ask whether this worry contains an action or only a prediction.','Give planning ten minutes, then return to something happening today.','Choose one preparation step and let that be enough for now.','Notice one future possibility that could go right, not only the ones that could go wrong.'],badDay:['Change one physical thing: room, posture, light, or fresh air.','Give yourself one easy win in the next ten minutes.','Do something you usually enjoy without requiring it to fix your mood.','Put on one song that reliably changes the energy in the room.','Find one thing about today that is not terrible and give it thirty seconds of attention.']};
const names={work:'Work',money:'Money',family:'Family / relationship',lonely:'Lonely',overwhelmed:'Too much at once',health:'Health / energy',mistake:'I messed something up',future:'Worried about the future',badDay:'Just a bad day'},fn={stressed:'Stressed',sad:'Down / sad',angry:'Angry',anxious:'Anxious / worried',tired:'Drained',frustrated:'Frustrated',unmotivated:'No motivation',mixed:'A mix of everything'};let cause='badDay',feeling='mixed',seen=new Set();function chips(obj,id,set){let box=document.getElementById(id);Object.keys(obj).forEach(k=>{let b=document.createElement('button');b.className='chip';b.textContent=(id==='causes'?names[k]:fn[k]);b.onclick=()=>{set(k);[...box.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};box.appendChild(b)})}chips(C,'causes',v=>{cause=v;seen.clear()});chips(F,'feelings',v=>{feeling=v;seen.clear()});const pick=a=>a[Math.floor(Math.random()*a.length)];function generate(){let x,key,n=0;do{x=[pick(C[cause]),pick(F[feeling]),pick(B),pick(A[cause])];key=x.join('|');n++}while(seen.has(key)&&n<100);seen.add(key);document.getElementById('label').textContent=names[cause]+' • '+fn[feeling];document.getElementById('message').textContent=x[0];document.getElementById('perspective').textContent=x[1]+' '+x[2];document.getElementById('action').textContent=x[3];document.getElementById('result').classList.add('show');document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})}document.getElementById('lift').onclick=generate;document.getElementById('another').onclick=generate;document.getElementById('change').onclick=()=>{document.getElementById('result').classList.remove('show');document.getElementById('checkin').scrollIntoView({behavior:'smooth'})};let now=new Date();document.getElementById('date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
