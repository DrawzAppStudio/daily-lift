<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#b6ff00" />
  <meta name="description" content="Daily Lift — a simple daily positive boost." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Daily Lift</title>
  <style>
    :root{--bg:#050505;--card:#101010;--lime:#b6ff00;--text:#f7f7f7;--muted:#bcbcbc}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 15%,#1d2a00 0,#090d00 30%,#050505 62%)}
    main{width:min(680px,100%);text-align:center}.logo{width:86px;height:86px;margin:0 auto 12px;display:grid;place-items:center;border:3px solid var(--lime);border-radius:28px;box-shadow:0 0 28px #b6ff0060;font-size:42px;font-weight:900;color:var(--lime)}
    h1{margin:4px 0 0;font-size:clamp(34px,8vw,56px);letter-spacing:-2px;color:var(--lime)}.date{margin:8px 0 24px;color:var(--muted);font-weight:650}
    .card{background:linear-gradient(180deg,#121212,#0c0c0c);border:1px solid #303030;border-radius:26px;padding:28px 24px;box-shadow:0 18px 55px #0008}
    .eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:900}.message{font-size:clamp(24px,6vw,36px);line-height:1.2;font-weight:850;margin:14px auto 18px;max-width:560px}.small{color:var(--muted);line-height:1.55;margin:0 auto 20px;max-width:520px}
    button{width:100%;border:0;border-radius:18px;padding:17px 20px;background:var(--lime);color:#050505;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 0 24px #b6ff0038}button:active{transform:scale(.985)}
    .footer{font-size:13px;color:#888;margin-top:18px}.spark{display:inline-block;color:var(--lime);animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.18);filter:drop-shadow(0 0 7px var(--lime))}}
  </style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">↑</div>
  <h1>Daily Lift</h1>
  <div class="date" id="date"></div>
  <section class="card" aria-live="polite">
    <div class="eyebrow">Your lift for today</div>
    <div class="message" id="message"></div>
    <p class="small" id="action"></p>
    <button id="boost">Give me another boost</button>
  </section>
  <div class="footer"><span class="spark">✦</span> One good thought. One good move. Keep going.</div>
</main>
<script>
const lifts=[
 ["You do not need a perfect day to make today count.","Pick one small thing you can finish today. Do that first."],
 ["Progress can be quiet and still be real.","Notice one thing you handle better now than you used to."],
 ["Your next good choice matters more than the last bad one.","Make the next choice a useful one — even if it is small."],
 ["You have made it through every hard day behind you.","Focus only on the next hour, not the whole mountain."],
 ["A little momentum can change the direction of a day.","Stand up, stretch, drink some water, and reset."],
 ["You are allowed to be proud of effort before the result arrives.","Give yourself credit for one thing you are actively working on."],
 ["Today is still yours to shape.","Choose one thing that would make tonight feel better than this morning."],
 ["Small wins are how big changes are built.","Make one easy win happen in the next ten minutes."],
 ["You can have a rough moment without calling it a rough life.","Let this moment pass without giving it the final word."],
 ["Keep moving. You are building something your future self gets to live in.","Do one thing today that tomorrow-you will appreciate."],
 ["You deserve some of the patience you give everyone else.","Talk to yourself today like someone you are responsible for helping."],
 ["There is still something good you can add to this day.","Find it, make it, or be it for somebody else."],
 ["You are stronger when you keep showing up than when you wait to feel ready.","Take the useful step before motivation catches up."],
 ["Not everything needs to be solved today.","Handle what is actually in front of you and let tomorrow keep its share."],
 ["A reset does not require a new week, a new month, or a new year.","Start again with your very next decision."]
];
const now=new Date();document.getElementById('date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const dayKey=Math.floor(new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()/86400000);let i=((dayKey%lifts.length)+lifts.length)%lifts.length;
function show(){document.getElementById('message').textContent=lifts[i][0];document.getElementById('action').textContent=lifts[i][1]}
show();document.getElementById('boost').onclick=()=>{i=(i+1)%lifts.length;show()};
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
